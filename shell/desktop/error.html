<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>无法打开页面</title>
<style>
  html,body{height:100%;margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fafafa;color:#333}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  h1{font-size:24px;margin:0}
  p{color:#666;margin:0 0 12px}
  button{font-size:16px;padding:10px 28px;border-radius:10px;border:0;background:#f57c00;color:#fff;cursor:pointer;margin:4px}
  button.sec{background:#fff;color:#f57c00;border:1px solid #f57c00}
</style>
</head>
<body>
<div class="box">
  <h1 id="t">页面加载失败</h1>
  <p id="m">请检查网络连接后重试。</p>
  <div>
    <button onclick="ZhidianDesktop.reload()">重新加载</button>
    <button class="sec" onclick="ZhidianDesktop.home()">返回首页</button>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var i = ZhidianDesktop.info();
  document.getElementById('t').textContent = i.name + ' · 页面加载失败';
  if (q.get('msg')) document.getElementById('m').textContent = q.get('msg');
</script>
</body>
</html>
